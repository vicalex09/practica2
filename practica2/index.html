<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema de Información del Mundo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="py-5 text-white text-center mb-4 header-blue">
        <div class="container">
            <h1>Sistema de Información del Mundo</h1>
            <p>Datos en tiempo real desde REST Countries API</p>
            <div class="d-flex justify-content-center align-items-center mt-3">
                <input type="text" id="buscar-pais" class="form-control me-2" placeholder="Buscar país..." style="max-width: 300px;">
                <select id="filtrar-region" class="form-select me-2" style="max-width: 200px;">
                    <option value="">Todas las regiones</option>
                    <option value="Africa">Africa</option>
                    <option value="Americas">Americas</option>
                    <option value="Asia">Asia</option>
                    <option value="Europe">Europe</option>
                    <option value="Oceania">Oceania</option>
                </select>
                <button id="toggle-modo" class="btn btn-outline-light">Modo Oscuro</button>
            </div>
        </div>
    </header> 

    <main class="container">
        <div id="contenedor-paises" class="row g-4">
            <div class="text-center">
                <p>Cargando información...</p>
            </div>
        </div>
        <div id="detalles-pais" class="d-none">
            <button id="volver" class="btn btn-secondary mb-3">Volver</button>
            <div id="info-detalles" class="row">
                <!-- Detalles del país aquí -->
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

    <script src="script.js"></script>

</body>
</html>
